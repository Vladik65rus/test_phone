<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест скорости РЖЯ</title>
<style>
:root{--bg:#F6F4FB;--card:#fff;--tx:#1F1A3A;--mut:#5C5677;--acc:#6A1BD1;--ok:#1E7B4A;--line:#E3DDF3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121F;--card:#211C30;--tx:#F1EEF9;--mut:#B4ADCB;--acc:#A77BFF;--ok:#5FD39A;--line:#352E4A}}
:root[data-theme="dark"]{--bg:#15121F;--card:#211C30;--tx:#F1EEF9;--mut:#B4ADCB;--acc:#A77BFF;--ok:#5FD39A;--line:#352E4A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,Arial,sans-serif;padding:20px 16px}
main{max-width:560px;margin:0 auto}h1{font-size:24px;margin:0 0 6px}p{color:var(--mut);margin:0 0 16px}
button{width:100%;padding:16px;font-size:18px;font-weight:600;border:0;border-radius:14px;background:var(--acc);color:#fff}
button:disabled{opacity:.5}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.v{font-weight:700;font-variant-numeric:tabular-nums}.big{font-size:20px;color:var(--ok);font-weight:700;margin-top:10px}
small{color:var(--mut);word-break:break-word}
</style></head><body><main>
<h1>Тест скорости на телефоне</h1>
<p>Переводчик РЖЯ: проверка, успевают ли нейросети распознавания работать в реальном времени. Камера не нужна, данные никуда не отправляются.</p>
<button id="go">Запустить тест</button>
<div class="card" id="out"><div class="row"><span>Статус</span><span class="v" id="st">ждёт запуска</span></div></div>
<div class="card"><small id="ua"></small></div>
</main>
<script src="ort.wasm.min.js"></script>
<script>
const $=id=>document.getElementById(id);
$('ua').textContent='Устройство: '+navigator.userAgent+' · ядер: '+(navigator.hardwareConcurrency||'?');
ort.env.wasm.wasmPaths=new URL('./',location.href).href;
ort.env.wasm.numThreads=1;
function rnd(n){const a=new Float32Array(n);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;return a}
let M=null;
function b64(t){const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function bench(file,shape,runs){
  if(!M){M=await (await fetch('models.json')).json()}
  const s=await ort.InferenceSession.create(b64(M[file]),{executionProviders:['wasm']});
  const x=new ort.Tensor('float32',rnd(shape.reduce((a,b)=>a*b)),shape);
  for(let i=0;i<5;i++)await s.run({x});
  const t=performance.now();for(let i=0;i<runs;i++)await s.run({x});
  return (performance.now()-t)/runs;
}
function row(k,v){const d=document.createElement('div');d.className='row';d.innerHTML='<span>'+k+'</span><span class="v">'+v+'</span>';$('out').appendChild(d)}
$('go').onclick=async()=>{
  $('go').disabled=true;$('out').innerHTML='<div class="row"><span>Статус</span><span class="v" id="st">идёт тест…</span></div>';
  try{
    const a=await bench('signs',[1,40,311],30);row('Жесты (Transformer)',a.toFixed(1)+' мс');
    const b=await bench('dactyl',[1,48,337],30);row('Дактиль (TCN)',b.toFixed(1)+' мс');
    const tot=a+b;row('Вместе на шаг',tot.toFixed(1)+' мс');
    const d=document.createElement('div');d.className='big';
    d.textContent=tot<33?'Успевает: меньше одного кадра (33 мс при 30 к/с)':'Медленнее кадра: нужен пропуск кадров или облако';
    $('out').appendChild(d);$('st').textContent='готово — сделайте скриншот';
  }catch(e){$('st').textContent='ошибка';row('Текст ошибки',String(e.message||e))}
  $('go').disabled=false;
};
</script></body></html>
